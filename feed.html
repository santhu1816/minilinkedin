<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mini LinkedIn Feed - Share posts and connect with professionals">
  <title>Mini LinkedIn — Feed</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css">
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a66c2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/images/pwa-icon-192.png">
</head>
<body class="bg-[#f3f2ef] min-h-screen">

  <!-- Toast -->
  <div id="toast" class="toast bg-white rounded-xl shadow-2xl px-6 py-4 max-w-sm flex items-center gap-3">
    <span id="toast-icon" class="text-2xl">✅</span>
    <span id="toast-message" class="text-gray-700 text-sm font-medium"></span>
  </div>

  <!-- Navigation Bar -->
  <nav class="nav-gradient sticky top-0 z-50 shadow-lg">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <!-- Logo -->
      <a href="/feed.html" class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-lg bg-white/20 flex items-center justify-center">
          <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24">
            <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.79M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/>
          </svg>
        </div>
        <span class="text-white font-bold text-lg hidden sm:inline">Mini LinkedIn</span>
      </a>

      <!-- Nav Links -->
      <div class="flex items-center gap-1 sm:gap-2">
        <a href="/feed.html" class="flex flex-col items-center px-3 py-1 text-white/90 hover:text-white transition" id="nav-feed">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1h-2z"/></svg>
          <span class="text-[10px] mt-0.5 font-medium">Feed</span>
        </a>
        <a href="/profile.html" class="flex flex-col items-center px-3 py-1 text-white/70 hover:text-white transition" id="nav-profile">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          <span class="text-[10px] mt-0.5 font-medium">Profile</span>
        </a>
        <a href="/notifications.html" class="flex flex-col items-center px-3 py-1 text-white/70 hover:text-white transition relative" id="nav-notifications">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
          <span class="text-[10px] mt-0.5 font-medium">Alerts</span>
          <span id="notification-count" class="notification-badge hidden">0</span>
        </a>
        <button onclick="handleLogout()" class="ml-2 flex flex-col items-center px-3 py-1 text-white/70 hover:text-white transition" id="nav-logout">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          <span class="text-[10px] mt-0.5 font-medium">Logout</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-2xl mx-auto px-4 py-6">

    <!-- Create Post Card -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 mb-6 fade-in-up">
      <div class="flex items-center gap-3 mb-3">
        <img id="user-avatar" src="https://ui-avatars.com/api/?name=U&background=0a66c2&color=fff&size=40" alt="avatar" class="w-10 h-10 rounded-full object-cover">
        <button onclick="openCreatePostModal()" class="flex-1 text-left px-4 py-2.5 bg-gray-50 hover:bg-gray-100 rounded-full text-gray-500 text-sm transition">
          What's on your mind?
        </button>
      </div>
      <div class="flex items-center gap-2 pt-2 border-t border-gray-100">
        <button onclick="openCreatePostModal()" class="flex-1 flex items-center justify-center gap-2 py-2 rounded-lg hover:bg-gray-50 transition text-sm text-gray-600">
          <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          Photo
        </button>
        <button onclick="openCreatePostModal()" class="flex-1 flex items-center justify-center gap-2 py-2 rounded-lg hover:bg-gray-50 transition text-sm text-gray-600">
          <svg class="w-5 h-5 text-green-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
          Write Post
        </button>
      </div>
    </div>

    <!-- Posts Feed -->
    <div id="posts-feed">
      <!-- Loading skeletons -->
      <div class="space-y-4" id="feed-skeleton">
        <div class="bg-white rounded-xl shadow-sm p-4">
          <div class="flex items-center gap-3 mb-4">
            <div class="skeleton w-10 h-10 rounded-full"></div>
            <div class="flex-1">
              <div class="skeleton h-4 w-32 mb-1"></div>
              <div class="skeleton h-3 w-24"></div>
            </div>
          </div>
          <div class="skeleton h-4 w-full mb-2"></div>
          <div class="skeleton h-4 w-3/4 mb-4"></div>
          <div class="skeleton h-48 w-full rounded-lg"></div>
        </div>
      </div>
    </div>

    <!-- Empty state -->
    <div id="empty-feed" class="hidden text-center py-16">
      <div class="w-20 h-20 mx-auto bg-blue-50 rounded-full flex items-center justify-center mb-4">
        <svg class="w-10 h-10 text-blue-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>
      </div>
      <h3 class="text-lg font-semibold text-gray-700 mb-1">No posts yet</h3>
      <p class="text-gray-500 text-sm">Be the first to share something with the community!</p>
    </div>
  </main>

  <!-- Create Post Modal -->
  <div id="create-post-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto fade-in-up">
      <!-- Modal Header -->
      <div class="flex items-center justify-between p-4 border-b border-gray-100">
        <h2 class="text-lg font-bold text-gray-800">Create a Post</h2>
        <button onclick="closeCreatePostModal()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 transition">
          <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Modal Body -->
      <form id="create-post-form" class="p-4">
        <div class="flex items-start gap-3 mb-4">
          <img id="modal-user-avatar" src="https://ui-avatars.com/api/?name=U&background=0a66c2&color=fff&size=40" alt="avatar" class="w-10 h-10 rounded-full object-cover">
          <div>
            <p id="modal-user-name" class="text-sm font-semibold text-gray-800">User</p>
            <p class="text-xs text-gray-500">Posting publicly</p>
          </div>
        </div>

        <textarea id="post-caption" rows="5" placeholder="What do you want to talk about?"
          class="w-full resize-none border-none outline-none text-gray-700 text-sm placeholder-gray-400 mb-4"></textarea>

        <!-- AI Caption Enhance Button -->
        <button type="button" id="enhance-caption-btn" onclick="enhanceCaption()"
          class="ai-btn text-white text-xs font-semibold px-4 py-2 rounded-lg flex items-center gap-2 mb-4">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.455 2.456L21.75 6l-1.036.259a3.375 3.375 0 00-2.455 2.456z"/></svg>
          ✨ AI Enhance Caption
        </button>

        <!-- Image upload -->
        <div class="border-2 border-dashed border-gray-200 rounded-xl p-4 text-center mb-4 hover:border-blue-400 transition cursor-pointer" onclick="document.getElementById('post-image').click()">
          <input type="file" id="post-image" accept="image/*" class="hidden" onchange="previewPostImage(event)">
          <div id="image-preview-container" class="hidden mb-3">
            <img id="image-preview" src="" alt="preview" class="max-h-48 mx-auto rounded-lg">
            <button type="button" onclick="removeImagePreview(event)" class="text-xs text-red-500 mt-2 hover:underline">Remove image</button>
          </div>
          <div id="upload-placeholder">
            <svg class="w-8 h-8 text-gray-400 mx-auto mb-2" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909M3.75 21h16.5A2.25 2.25 0 0022.5 18.75V5.25A2.25 2.25 0 0020.25 3H3.75A2.25 2.25 0 001.5 5.25v13.5A2.25 2.25 0 003.75 21z"/></svg>
            <p class="text-sm text-gray-500">Click to add a photo</p>
          </div>
        </div>

        <button type="submit" id="post-submit-btn"
          class="w-full btn-primary text-white py-3 rounded-xl font-semibold text-sm flex items-center justify-center gap-2">
          Post
        </button>
      </form>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/ai.js"></script>
  <script src="/js/feed.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(reg => console.log('Service Worker registered'))
          .catch(err => console.log('Service Worker registration failed', err));
      });
    }
  </script>
</body>
</html>
