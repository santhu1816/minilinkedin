<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mini LinkedIn Notifications - See who shares your skills">
  <title>Mini LinkedIn — Notifications</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-[#f3f2ef] min-h-screen">

  <!-- Toast -->
  <div id="toast" class="toast bg-white rounded-xl shadow-2xl px-6 py-4 max-w-sm flex items-center gap-3">
    <span id="toast-icon" class="text-2xl">✅</span>
    <span id="toast-message" class="text-gray-700 text-sm font-medium"></span>
  </div>

  <!-- Navigation -->
  <nav class="nav-gradient sticky top-0 z-50 shadow-lg">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/feed.html" class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-lg bg-white/20 flex items-center justify-center">
          <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24">
            <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.79M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/>
          </svg>
        </div>
        <span class="text-white font-bold text-lg hidden sm:inline">Mini LinkedIn</span>
      </a>
      <div class="flex items-center gap-1 sm:gap-2">
        <a href="/feed.html" class="flex flex-col items-center px-3 py-1 text-white/70 hover:text-white transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1h-2z"/></svg>
          <span class="text-[10px] mt-0.5 font-medium">Feed</span>
        </a>
        <a href="/profile.html" class="flex flex-col items-center px-3 py-1 text-white/70 hover:text-white transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          <span class="text-[10px] mt-0.5 font-medium">Profile</span>
        </a>
        <a href="/notifications.html" class="flex flex-col items-center px-3 py-1 text-white/90 hover:text-white transition relative">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
          <span class="text-[10px] mt-0.5 font-medium">Alerts</span>
        </a>
        <button onclick="handleLogout()" class="ml-2 flex flex-col items-center px-3 py-1 text-white/70 hover:text-white transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          <span class="text-[10px] mt-0.5 font-medium">Logout</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Notifications Content -->
  <main class="max-w-2xl mx-auto px-4 py-6">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-500 to-indigo-600 flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z"/></svg>
      </div>
      <div>
        <h1 class="text-xl font-bold text-gray-900">Skill Match Notifications</h1>
        <p class="text-gray-500 text-sm">People who share your skills and interests</p>
      </div>
    </div>

    <!-- Loading skeleton -->
    <div id="notifications-skeleton" class="space-y-3">
      <div class="bg-white rounded-xl p-4 flex items-center gap-4">
        <div class="skeleton w-12 h-12 rounded-full"></div>
        <div class="flex-1">
          <div class="skeleton h-4 w-48 mb-2"></div>
          <div class="skeleton h-3 w-32"></div>
        </div>
      </div>
      <div class="bg-white rounded-xl p-4 flex items-center gap-4">
        <div class="skeleton w-12 h-12 rounded-full"></div>
        <div class="flex-1">
          <div class="skeleton h-4 w-40 mb-2"></div>
          <div class="skeleton h-3 w-36"></div>
        </div>
      </div>
    </div>

    <!-- Notifications List -->
    <div id="notifications-list" class="space-y-3 hidden"></div>

    <!-- Empty State -->
    <div id="empty-notifications" class="hidden text-center py-16">
      <div class="w-20 h-20 mx-auto bg-purple-50 rounded-full flex items-center justify-center mb-4">
        <svg class="w-10 h-10 text-purple-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M18 18.72a9.094 9.094 0 003.741-.479 3 3 0 00-4.682-2.72m.94 3.198l.001.031c0 .225-.012.447-.037.666A11.944 11.944 0 0112 21c-2.17 0-4.207-.576-5.963-1.584A6.062 6.062 0 016 18.719m12 0a5.971 5.971 0 00-.941-3.197m0 0A5.995 5.995 0 0012 12.75a5.995 5.995 0 00-5.058 2.772m0 0a3 3 0 00-4.681 2.72 8.986 8.986 0 003.74.477m.94-3.197a5.971 5.971 0 00-.94 3.197M15 6.75a3 3 0 11-6 0 3 3 0 016 0zm6 3a2.25 2.25 0 11-4.5 0 2.25 2.25 0 014.5 0zm-13.5 0a2.25 2.25 0 11-4.5 0 2.25 2.25 0 014.5 0z"/></svg>
      </div>
      <h3 class="text-lg font-semibold text-gray-700 mb-1">No skill matches yet</h3>
      <p class="text-gray-500 text-sm max-w-sm mx-auto">Add skills to your profile or create posts mentioning your skills to find people with similar interests!</p>
    </div>
  </main>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/notifications.js"></script>
</body>
</html>
