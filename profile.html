<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mini LinkedIn Profile - View and edit your professional profile">
  <title>Mini LinkedIn — Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css">
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a66c2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/images/pwa-icon-192.png">
</head>
<body class="bg-[#f3f2ef] min-h-screen">

  <!-- Toast -->
  <div id="toast" class="toast bg-white rounded-xl shadow-2xl px-6 py-4 max-w-sm flex items-center gap-3">
    <span id="toast-icon" class="text-2xl">✅</span>
    <span id="toast-message" class="text-gray-700 text-sm font-medium"></span>
  </div>

  <!-- Navigation -->
  <nav class="nav-gradient sticky top-0 z-50 shadow-lg">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/feed.html" class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-lg bg-white/20 flex items-center justify-center">
          <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24">
            <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.79M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/>
          </svg>
        </div>
        <span class="text-white font-bold text-lg hidden sm:inline">Mini LinkedIn</span>
      </a>
      <div class="flex items-center gap-1 sm:gap-2">
        <a href="/feed.html" class="flex flex-col items-center px-3 py-1 text-white/70 hover:text-white transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1h-2z"/></svg>
          <span class="text-[10px] mt-0.5 font-medium">Feed</span>
        </a>
        <a href="/profile.html" class="flex flex-col items-center px-3 py-1 text-white/90 hover:text-white transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          <span class="text-[10px] mt-0.5 font-medium">Profile</span>
        </a>
        <a href="/notifications.html" class="flex flex-col items-center px-3 py-1 text-white/70 hover:text-white transition relative">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
          <span class="text-[10px] mt-0.5 font-medium">Alerts</span>
        </a>
        <button onclick="handleLogout()" class="ml-2 flex flex-col items-center px-3 py-1 text-white/70 hover:text-white transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          <span class="text-[10px] mt-0.5 font-medium">Logout</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Profile Content -->
  <main class="max-w-3xl mx-auto px-4 py-6">

    <!-- Profile Header Card -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden fade-in-up mb-6">
      <!-- Banner -->
      <div class="h-32 sm:h-44 bg-gradient-to-r from-blue-600 via-blue-500 to-cyan-400 relative">
        <div class="absolute -bottom-12 left-6">
          <img id="profile-pic" src="https://ui-avatars.com/api/?name=U&background=0a66c2&color=fff&size=120" alt="profile"
            class="profile-pic-lg">
        </div>
      </div>

      <div class="pt-14 pb-6 px-6">
        <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-3">
          <div>
            <h1 id="profile-name" class="text-2xl font-bold text-gray-900">Loading...</h1>
            <p id="profile-headline" class="text-gray-600 text-sm mt-0.5"></p>
            <p id="profile-email" class="text-gray-400 text-xs mt-1"></p>
          </div>
          <div id="edit-btn-container" class="hidden">
            <button onclick="toggleEditMode()" id="edit-toggle-btn"
              class="btn-primary text-white px-5 py-2 rounded-full text-sm font-semibold flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
              Edit Profile
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- View Mode -->
    <div id="view-mode">
      <!-- Bio -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-4 fade-in-up">
        <h2 class="text-lg font-bold text-gray-900 mb-3">About</h2>
        <p id="view-bio" class="text-gray-600 text-sm leading-relaxed">No bio yet.</p>
      </div>

      <!-- Skills -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-4 fade-in-up">
        <h2 class="text-lg font-bold text-gray-900 mb-3">Skills</h2>
        <div id="view-skills" class="flex flex-wrap gap-2">
          <p class="text-gray-400 text-sm">No skills added yet.</p>
        </div>
      </div>

      <!-- Experience -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-4 fade-in-up">
        <h2 class="text-lg font-bold text-gray-900 mb-3">Experience</h2>
        <div id="view-experience">
          <p class="text-gray-400 text-sm">No experience added yet.</p>
        </div>
      </div>

      <!-- Education -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-4 fade-in-up">
        <h2 class="text-lg font-bold text-gray-900 mb-3">Education</h2>
        <div id="view-education">
          <p class="text-gray-400 text-sm">No education added yet.</p>
        </div>
      </div>
    </div>

    <!-- Edit Mode (hidden by default) -->
    <div id="edit-mode" class="hidden">
      <form id="profile-form" class="space-y-4">
        <!-- Profile Picture -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 fade-in-up">
          <h2 class="text-lg font-bold text-gray-900 mb-3">Profile Picture</h2>
          <input type="file" id="edit-profile-pic" accept="image/*" class="text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        </div>

        <!-- Basic Info -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 fade-in-up">
          <h2 class="text-lg font-bold text-gray-900 mb-3">Basic Info</h2>
          <div class="space-y-3">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
              <input type="text" id="edit-name" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition text-sm">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Headline</label>
              <input type="text" id="edit-headline" placeholder="e.g. Full Stack Developer at Google" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition text-sm">
            </div>
          </div>
        </div>

        <!-- Bio with AI Enhancer -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 fade-in-up">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-lg font-bold text-gray-900">About</h2>
            <button type="button" onclick="enhanceBio()"
              class="ai-btn text-white text-xs font-semibold px-4 py-2 rounded-lg flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.455 2.456L21.75 6l-1.036.259a3.375 3.375 0 00-2.455 2.456z"/></svg>
              ✨ AI Enhance
            </button>
          </div>
          <textarea id="edit-bio" rows="4" placeholder="Tell people about yourself..."
            class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition text-sm resize-none"></textarea>
        </div>

        <!-- Skills -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 fade-in-up">
          <h2 class="text-lg font-bold text-gray-900 mb-3">Skills</h2>
          <div id="skills-container" class="flex flex-wrap gap-2 mb-3"></div>
          <div class="flex gap-2">
            <input type="text" id="new-skill" placeholder="Add a skill (e.g. JavaScript)" class="flex-1 px-4 py-2.5 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition text-sm">
            <button type="button" onclick="addSkill()" class="px-4 py-2.5 bg-blue-50 text-blue-600 rounded-xl text-sm font-semibold hover:bg-blue-100 transition">Add</button>
          </div>
        </div>

        <!-- Experience -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 fade-in-up">
          <h2 class="text-lg font-bold text-gray-900 mb-3">Experience</h2>
          <div id="experience-container" class="space-y-3 mb-3"></div>
          <button type="button" onclick="addExperienceField()" class="text-blue-600 text-sm font-semibold hover:underline flex items-center gap-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"/></svg>
            Add Experience
          </button>
        </div>

        <!-- Education -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 fade-in-up">
          <h2 class="text-lg font-bold text-gray-900 mb-3">Education</h2>
          <div id="education-container" class="space-y-3 mb-3"></div>
          <button type="button" onclick="addEducationField()" class="text-blue-600 text-sm font-semibold hover:underline flex items-center gap-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"/></svg>
            Add Education
          </button>
        </div>

        <!-- Save/Cancel -->
        <div class="flex gap-3">
          <button type="submit" class="flex-1 btn-primary text-white py-3 rounded-xl font-semibold text-sm">Save Changes</button>
          <button type="button" onclick="toggleEditMode()" class="flex-1 bg-gray-100 text-gray-700 py-3 rounded-xl font-semibold text-sm hover:bg-gray-200 transition">Cancel</button>
        </div>
      </form>
    </div>
  </main>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/ai.js"></script>
  <script src="/js/profile.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(reg => console.log('Service Worker registered'))
          .catch(err => console.log('Service Worker registration failed', err));
      });
    }
  </script>
</body>
</html>
